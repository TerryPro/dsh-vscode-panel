<!doctype html>
<!--
  PROTOTYPE · 一次性代码，别当实现读。

  要回答的问题：SQL 界面职责重新划分后，中栏工具条那块「连接」该长成什么样？
  （工单：docs/sql-ui-scope-design.zh.md。归属已定死——连接面在中栏、结构面在侧栏、
   状态条只报别人没说的事。本文件只变「承载形状」，不变归属。）

  四个变体，?variant=A|B|C|D，底部浮动条或 ←/→ 键切换。
  文案全部取自 src/client/core/locales.ts 的真实中文串，好跟在跑的 DSH 直接对比。
  --dsw-alias-* 由宿主定义，本仓取不到真实值，下面按近似值内联；落地时换成真 token。
-->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · SQL 界面职责划分</title>
<style>
  :root{
    --dsw-alias-bg-base:#ffffff; --dsw-alias-bg-layer-1:#f7f8fa; --dsw-alias-bg-layer-2:#eef0f3;
    --dsw-alias-border-l1:#e3e6ea; --dsw-alias-border-l2:#cfd4da;
    --dsw-alias-label-primary:#1c1f23; --dsw-alias-label-secondary:#5b636d; --dsw-alias-label-tertiary:#8b939d;
    --dsw-alias-interactive-bg-hover:#eceff3; --dsw-alias-state-error-primary:#c2361b;
    --dsw-alias-state-error-secondary:#fdeeec; --dsw-alias-state-business-primary:#b26a00;
    --dsh-workbench-view-toolbar-height:37px; --dsw-alias-brand-primary:#3b6cf0;
    font-synthesis:none;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --dsw-alias-bg-base:#1b1d21; --dsw-alias-bg-layer-1:#212429; --dsw-alias-bg-layer-2:#262a30;
      --dsw-alias-border-l1:#2f343b; --dsw-alias-border-l2:#3c434b;
      --dsw-alias-label-primary:#e6e9ed; --dsw-alias-label-secondary:#a5adb8; --dsw-alias-label-tertiary:#79818c;
      --dsw-alias-interactive-bg-hover:#2b3037; --dsw-alias-state-error-primary:#ff7a63;
      --dsw-alias-state-error-secondary:#3a221e; --dsw-alias-state-business-primary:#e0a03c;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:#0d0f12;color:var(--dsw-alias-label-primary);
    font:12.5px/1.5 -apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
  code,.mono{font-family:ui-monospace,Cascadia Code,Consolas,monospace}

  /* ---------- 原型外壳（不是被评审的设计） ---------- */
  .chrome{position:sticky;top:0;z-index:40;background:#15181c;color:#cfd6de;
    padding:9px 14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;
    border-bottom:1px solid #23272d;font-size:12px}
  .badge{background:#7a2e12;color:#ffd9cc;padding:2px 8px;border-radius:4px;font-weight:700;letter-spacing:.02em}
  .chrome label{display:flex;gap:6px;align-items:center;color:#9aa4b0}
  .chrome select,.chrome input[type=range]{background:#20242a;color:#e6e9ed;border:1px solid #2f353d;
    border-radius:4px;padding:2px 5px;font:inherit}
  .chrome .verdict{color:#8b939d;max-width:46ch}
  .statedump{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:#7f8893;text-align:right}
  .statedump b{color:#dfe4ea;font-weight:600}

  /* ---------- 工作台假壳 ---------- */
  .shell-wrap{display:flex;justify-content:center;padding:16px 0 84px}
  .shell{background:var(--dsw-alias-bg-base);border:1px solid #2a2f36;display:flex;
    height:620px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .dock{flex:0 0 36px;background:var(--dsw-alias-bg-layer-1);border-inline-end:1px solid var(--dsw-alias-border-l1);
    display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0}
  .dock i{width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--dsw-alias-label-tertiary);
    font-style:normal;font-size:11px}
  .dock i.on{background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-brand-primary);font-weight:700}
  .side{flex:0 0 268px;min-width:0;background:var(--dsw-alias-bg-layer-1);border-inline-end:1px solid var(--dsw-alias-border-l1);
    display:flex;flex-direction:column}
  .mid{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--dsw-alias-bg-base)}

  /* ---------- 侧栏：只剩结构 ---------- */
  .panelHeader{display:flex;align-items:center;justify-content:space-between;gap:6px;
    min-height:34px;padding:2px 12px 7px 8px;color:var(--dsw-alias-label-secondary);
    border-bottom:1px solid var(--dsw-alias-border-l1)}
  .panelTitle{font-size:12px}
  .headerAction{width:22px;height:22px;border:1px solid transparent;border-radius:5px;background:transparent;
    color:var(--dsw-alias-label-tertiary);font-size:12px;cursor:pointer}
  .headerAction:hover:not(:disabled){background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary)}
  .headerAction:disabled{opacity:.4;cursor:default}
  .panelBody{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 12px 16px 8px;display:flex;flex-direction:column;gap:8px}
  .notebookLine{font-size:11px;color:var(--dsw-alias-label-tertiary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{font-size:11px;color:var(--dsw-alias-label-tertiary)}
  .panelEmpty{font-size:11.5px;color:var(--dsw-alias-label-tertiary);padding:14px 2px}
  .pointerLine{font-size:11.5px;color:var(--dsw-alias-label-secondary);background:var(--dsw-alias-bg-layer-2);
    border-radius:6px;padding:7px 9px;line-height:1.55}
  .schemaNode{border-radius:6px}
  .tableRow{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;border-radius:5px;
    background:transparent;color:var(--dsw-alias-label-primary);font:inherit;padding:3px 6px;cursor:pointer}
  .tableRow:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .tableName{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,monospace;font-size:11.5px}
  .tableKind{font-size:10px;color:var(--dsw-alias-label-tertiary);border:1px solid var(--dsw-alias-border-l1);
    border-radius:3px;padding:0 4px}
  .columnList{list-style:none;margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:1px}
  .columnRow{display:flex;gap:6px;align-items:baseline;padding:1px 6px;border-radius:4px;font-size:11px}
  .columnRow:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .columnName{font-family:ui-monospace,monospace;color:var(--dsw-alias-label-secondary)}
  .columnType{color:var(--dsw-alias-label-tertiary);font-size:10px}
  .columnBadge{font-size:9px;color:var(--dsw-alias-state-business-primary);border:1px solid currentColor;
    border-radius:3px;padding:0 3px}

  /* ---------- 中栏 ---------- */
  .tabstrip{display:flex;align-items:stretch;height:31px;background:var(--dsw-alias-bg-layer-1);
    border-bottom:1px solid var(--dsw-alias-border-l1);font-size:11.5px}
  .tab{display:flex;align-items:center;gap:6px;padding:0 11px;border-inline-end:1px solid var(--dsw-alias-border-l1);
    background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary)}
  .tab.off{background:transparent;color:var(--dsw-alias-label-tertiary)}
  .toolbar{display:flex;align-items:center;gap:6px;height:var(--dsh-workbench-view-toolbar-height);
    padding:0 10px;overflow:hidden;background:var(--dsw-alias-bg-layer-1);border-bottom:1px solid var(--dsw-alias-border-l1)}
  .row2{display:flex;align-items:center;gap:6px;height:29px;padding:0 10px;overflow:hidden;
    background:var(--dsw-alias-bg-layer-1);border-bottom:1px solid var(--dsw-alias-border-l1)}
  .tb{width:24px;height:22px;flex:0 0 auto;display:grid;place-items:center;border:0;border-radius:5px;
    background:transparent;color:var(--dsw-alias-label-secondary);cursor:pointer;font-size:12px}
  .tb:hover:not(:disabled){background:var(--dsw-alias-interactive-bg-hover);color:var(--dsw-alias-label-primary)}
  .tb:disabled{opacity:.4;cursor:default}
  .tb.hot{color:var(--dsw-alias-state-business-primary)}
  .div{width:1px;height:14px;background:var(--dsw-alias-border-l1);flex:0 0 auto}
  .sp{flex:1 1 auto;min-width:4px}
  .sel{height:22px;max-width:200px;min-width:0;padding:0 4px;border:1px solid var(--dsw-alias-border-l1);
    border-radius:5px;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);font:inherit;font-size:11.5px}
  .sel:disabled{opacity:.55;background:var(--dsw-alias-bg-layer-2)}
  .verb{height:22px;padding:0 8px;border:1px solid var(--dsw-alias-border-l1);border-radius:5px;
    background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);font:inherit;font-size:11.5px;cursor:pointer;flex:0 0 auto}
  .verb:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .readout{font-size:11px;color:var(--dsw-alias-label-tertiary);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
  .readout.dead{color:var(--dsw-alias-state-error-primary)}
  .chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border:1px solid var(--dsw-alias-border-l2);
    border-radius:11px;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);font:inherit;font-size:11.5px;cursor:pointer;flex:0 1 auto;min-width:0}
  .chip:hover{background:var(--dsw-alias-interactive-bg-hover)}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--dsw-alias-label-tertiary);flex:0 0 auto}
  .chip[data-on="1"] .dot{background:#2f9e44}
  .chip[data-on="warn"] .dot{background:var(--dsw-alias-state-error-primary)}
  .chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip .car{color:var(--dsw-alias-label-tertiary);font-size:9px}
  .notice{margin:8px 10px 0;padding:6px 10px;border-radius:6px;font-size:12px;background:var(--dsw-alias-bg-layer-1);color:var(--dsw-alias-label-secondary)}
  .noticeError{margin:8px 10px 0;padding:6px 10px;border-radius:6px;font-size:12px;
    background:var(--dsw-alias-state-error-secondary);color:var(--dsw-alias-state-error-primary)}
  .cells{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px}
  .cell{border:1px solid var(--dsw-alias-border-l1);border-radius:8px;overflow:hidden;margin-bottom:10px}
  .cellHeader{display:flex;align-items:center;gap:7px;padding:3px 8px;background:var(--dsw-alias-bg-layer-1);
    border-bottom:1px solid var(--dsw-alias-border-l1);font-size:11px;color:var(--dsw-alias-label-tertiary)}
  .prompt{font-family:ui-monospace,monospace;color:var(--dsw-alias-label-secondary)}
  .kind{border:1px solid var(--dsw-alias-border-l1);border-radius:4px;padding:0 5px;background:var(--dsw-alias-bg-base)}
  .cellBody{padding:8px 10px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;color:var(--dsw-alias-label-primary)}
  .statusbar{display:flex;align-items:center;gap:12px;height:24px;padding:0 10px;border-top:1px solid var(--dsw-alias-border-l1);
    background:var(--dsw-alias-bg-layer-1);font-size:11px;color:var(--dsw-alias-label-tertiary);white-space:nowrap;overflow:hidden}
  .statusbar .sb-att{color:var(--dsw-alias-label-secondary);min-width:0;overflow:hidden;text-overflow:ellipsis;
    display:flex;align-items:center;gap:8px;cursor:default}
  .statusbar button{border:0;background:transparent;color:var(--dsw-alias-label-tertiary);cursor:pointer;font:inherit;padding:0 2px}
  .statusbar button.on{color:var(--dsw-alias-brand-primary);font-weight:700}
  .result{margin:0 10px 10px;border-top:1px solid var(--dsw-alias-border-l1);padding-top:6px}
  .rbar{font-size:11px;color:var(--dsw-alias-label-tertiary);padding:2px 0 6px}
  table{border-collapse:collapse;font-size:11.5px;width:100%}
  th,td{border-bottom:1px solid var(--dsw-alias-border-l1);padding:2px 8px;text-align:left}
  th{color:var(--dsw-alias-label-secondary);font-weight:600;background:var(--dsw-alias-bg-layer-1)}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}

  /* ---------- 浮动条（原型外壳） ---------- */
  .switch{position:fixed;left:50%;translate:-50% 0;bottom:14px;z-index:60;display:flex;align-items:center;gap:4px;
    background:#111417;color:#e6e9ed;border:1px solid #3a424b;border-radius:999px;padding:4px;
    box-shadow:0 8px 24px rgba(0,0,0,.55);font-size:11.5px}
  .switch button{width:26px;height:26px;border:0;border-radius:50%;background:#22272d;color:#e6e9ed;cursor:pointer}
  .switch button:hover{background:#2f3740}
  .switch .cur{padding:0 10px;min-width:210px;text-align:center}
  .switch .cur b{color:#ffd9cc}
  .vbtn{border:0;background:transparent;color:#8b939d;cursor:pointer;padding:0 6px;border-radius:999px}
  .vbtn.on{background:#7a2e12;color:#ffd9cc}

  /* ---------- 弹层 / 菜单（原型外壳，用真 Menu 的话长这样） ---------- */
  .pop{position:fixed;z-index:55;min-width:272px;max-width:330px;background:var(--dsw-alias-bg-base);
    border:1px solid var(--dsw-alias-border-l2);border-radius:9px;box-shadow:0 12px 32px rgba(0,0,0,.32);
    padding:8px;display:none;flex-direction:column;gap:7px;font-size:12px}
  .pop.on{display:flex}
  .pop .fld{display:flex;flex-direction:column;gap:3px}
  .pop .fl{font-size:10.5px;color:var(--dsw-alias-label-secondary)}
  .pop .sel{max-width:none;width:100%}
  .pop hr{border:0;border-top:1px solid var(--dsw-alias-border-l1);margin:1px 0}
  .pop .hint{font-size:10.5px;color:var(--dsw-alias-label-tertiary);line-height:1.5}
  .pop .row{display:flex;gap:7px}
  .pop .row .verb{flex:1 1 auto}
  .menu{position:fixed;z-index:56;min-width:196px;background:var(--dsw-alias-bg-base);border:1px solid var(--dsw-alias-border-l2);
    border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.32);padding:4px;display:none;font-size:12px}
  .menu.on{display:block}
  .menu button{display:flex;width:100%;text-align:left;border:0;background:transparent;color:var(--dsw-alias-label-primary);
    font:inherit;padding:5px 9px;border-radius:5px;cursor:pointer;gap:8px;align-items:center}
  .menu button:hover:not(:disabled){background:var(--dsw-alias-interactive-bg-hover)}
  .menu button:disabled{color:var(--dsw-alias-label-tertiary);cursor:default}
  .menu .sep{height:1px;background:var(--dsw-alias-border-l1);margin:3px 0}
  .flag{font-size:10px;color:var(--dsw-alias-state-business-primary)}
  .legend{padding:10px 14px;color:#9aa4b0;font-size:11.5px;max-width:1100px;margin:0 auto}
  .legend b{color:#dfe4ea}
</style>
</head>
<body>

<div class="chrome">
  <span class="badge">PROTOTYPE</span>
  <label>连接状态
    <select id="stConn">
      <option value="file-ro">已连 demo.db（只读 · WAL）</option>
      <option value="file-wo">已连 demo.db（可写）</option>
      <option value="memory">已连 :memory:</option>
      <option value="none">未连接</option>
      <option value="refused">连接被拒（占用）</option>
    </select>
  </label>
  <label>视图
    <select id="stView"><option value="notebook">笔记视图</option><option value="source">源码视图</option></select>
  </label>
  <label>中栏宽度 <input id="stW" type="range" min="600" max="1320" step="10" value="1000"><span class="mono" id="stWv">1000px</span></label>
  <span class="statedump" id="dump"></span>
</div>
<div class="legend">
  四个变体<b>都不改动已定的归属</b>（连接面在中栏、结构面在侧栏、状态条只报别人没说的事）；只变「连接那块怎么承载」。
  侧栏、标签条、状态条、单元格区在四个变体里是同一份。<b>把宽度滑杆推到 760px 以下</b>再看 A：那就是「工具条太挤」的现场。
</div>

<div class="shell-wrap"><div class="shell" id="shell">
  <div class="dock"><i>≡</i><i>⌗</i><i>⑂</i><i>&gt;_</i><i class="on">SQL</i><i>◎</i></div>
  <div class="side" id="side"></div>
  <div class="mid" id="mid"></div>
</div></div>

<div class="switch">
  <button id="prev" title="上一个（←）">‹</button>
  <span class="cur" id="cur"></span>
  <button id="next" title="下一个（→）">›</button>
  <span id="dots" style="display:flex"></span>
</div>

<div class="pop" id="pop"></div>
<div class="menu" id="menu"></div>

<script>
/* ===== 数据（假，够真）===== */
const DICT = {
  database:'选择数据库', memoryDatabase:'内存库（:memory:）', connect:'连接', disconnect:'断开',
  notConnected:'未连接数据库', connecting:'正在连接…', readOnlyTier:'只读', writableTier:'可写',
  tierLocked:'改档需要先断开重连', rescan:'重新扫描工作区',
  scanTruncated:'工作区较大，只显示了前面一部分库文件',
  memoryNotice:'内存库随笔记关闭而消失，里面的表不会留在磁盘上。',
  walSidecarNotice:'只读打开 WAL 库会留下 -wal/-shm 两个文件，关闭连接不会删掉它们。',
  disconnectHint:'断开并释放连接；切换只读↔可写必须断开后重连，临时表与未提交事务会丢。',
  panelTitleNow:'SQL 连接', schema:'结构', refreshSchema:'刷新结构', panelNotebook:p=>'笔记 '+p,
  schemaEmpty:'这个库还没有表或视图。', viewLabel:'视图', primaryKey:'主键',
  connectInToolbar:'在笔记工具栏里选择数据库并连接',
  noDbRefusal:'该库文件已被其它笔记的连接占用，请改用只读，或先断开占用它的笔记。',
  insertSelect:'插入 SELECT *', insertTable:'插入表名', copyTable:'复制表名', copyCols:'复制列名',
  save:'保存', addSql:'在末尾新增 SQL 单元格', addMd:'在末尾新增文本单元格',
  runAll:'运行全部', clearAll:'清空全部输出', outline:'SQL 笔记大纲',
};
const DBS = [':memory:','examples/demo.db','data/archive.sqlite'];
const TABLES = [{n:'city',k:'table'},{n:'city_summary',k:'view'},{n:'country',k:'table'}];
const COLS = {city:[['id','INTEGER',1],['name','TEXT',0],['country_id','INTEGER',0],['population','INTEGER',0]],
              city_summary:[['name','TEXT',0],['population','INTEGER',0]]};
let CELLS = [
  {kind:'sql',src:'SELECT name, population\nFROM city\nORDER BY population DESC;',
   bar:'查询结果 · 3 行',rows:[['Delhi',32941115],['Chongqing',32096033],['Shanghai',28728790]]},
  {kind:'sql',src:'SELECT COUNT(*) FROM city;',bar:'查询结果 · 1 行',rows:[['COUNT(*)',1112]]},
];

/* ===== 状态 ===== */
const KEY={variant:'sql-ui-scope'};
let S = {
  variant:new URLSearchParams(location.search).get('variant')||'A',
  conn:'file-ro', view:'notebook', width:1000,
  openTable:'city', pop:false, menu:null, log:[],
};
const VARIANTS={
  A:{name:'现状直移',note:'工单的字面决定：工具条控件集合不变。挤不挤自己拖滑杆看。'},
  B:{name:'胶囊 + 弹层',note:'工具条常驻只剩一枚胶囊；两个下拉与重扫进弹层。违反「工具条不变」那条。'},
  C:{name:'第二行连接条',note:'连接控件独立成第二行，提示就地常驻（不需要 tooltip）。多花 29px 纵向。'},
  D:{name:'状态条承载',note:'连接入口搬到编辑器状态条（两种视图都在场）。工单 S7 的「让位」在此变成「搬过去」。'},
};
const CONN={
  'file-ro':{path:'examples/demo.db',access:'read-only',on:1,wal:true,limit:1000},
  'file-wo':{path:'examples/demo.db',access:'writable',on:1,wal:false,limit:1000},
  memory:{path:':memory:',access:'writable',on:1,wal:false,limit:1000},
  none:{path:null,access:null,on:0,wal:false,limit:1000},
  refused:{path:null,access:null,on:'warn',wal:false,limit:1000,refused:true},
};
function tierLabel(){const c=CONN[S.conn];return c.access==='writable'?DICT.writableTier:DICT.readOnlyTier}
function readoutText(){const c=CONN[S.conn];if(c.refused)return DICT.notConnected;if(!c.path)return DICT.notConnected;
  return c.path+' · '+tierLabel()+' · '+c.limit}
function isMem(){return CONN[S.conn].path===':memory:'}
/* 工单 S6b：连接后库下拉也要锁（现在只有档别锁），且 value 取实际连上的库 */
function chosen(){const c=CONN[S.conn];return c.path||'examples/demo.db'}
function locked(){return !!CONN[S.conn].path}

const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
function btn(label,title,cls,onclick,disabled){const b=el('button',cls||'tb',label);
  b.type='button';if(title){b.title=title;b.setAttribute('aria-label',label.replace(/<[^>]+>/g,''))}
  if(onclick)b.onclick=onclick;if(disabled)b.disabled=true;return b}

/* ===== 连接控件（各变体复用同一批零件，只是摆法不同）===== */
function pickerSel(){
  const s=el('select','sel');s.setAttribute('aria-label',DICT.database);
  // S6b：value 用实际连上的库，不用裸 pickPath —— 否则下拉与读数可以同时说两个库
  const cur=chosen();
  [['',DICT.database],[':memory:',DICT.memoryDatabase],['examples/demo.db','examples/demo.db'],['data/archive.sqlite','data/archive.sqlite']]
    .forEach(([v,l])=>{const o=el('option',null,l);o.value=v;if(v===cur)o.selected=true;if(cur===''&&!v)o.selected=true;s.append(o)});
  // S6b：连接后禁用（现在只有档别下拉禁用了，库下拉没禁，改了又没按钮应用它）
  s.disabled=locked();
  s.title=CONN[S.conn].wal?DICT.walSidecarNotice+'':DICT.scanTruncated;
  s.onchange=()=>log('选库 → '+s.value+(locked()?'（连接中被锁住）':''));
  return s
}
function tierSel(){
  const s=el('select','sel');s.style.maxWidth='92px';s.setAttribute('aria-label',locked()?DICT.tierLocked:DICT.readOnlyTier);
  [[DICT.readOnlyTier,'read-only'],[DICT.writableTier,'writable']].forEach(([l,v])=>{const o=el('option',null,l);o.value=v;
    if(CONN[S.conn].access===v)o.selected=true;s.append(o)});
  s.disabled=true; s.title=DICT.tierLocked; return s
}
function connectVerb(){
  const c=CONN[S.conn];
  if(c.path) return btn(DICT.disconnect,c.wal?DICT.disconnectHint:DICT.disconnectHint,'verb',()=>log('断开（丢中间成果，已提示）'));
  const b=btn(DICT.connect,c.refused?DICT.noDbRefusal:DICT.noDbRefusal,'verb',()=>log('连接'));
  return b
}
function noticeRows(){
  const out=[],c=CONN[S.conn];
  if(c.refused)out.push(el('div','noticeError',DICT.noDbRefusal));
  if(c.path===':memory:')out.push(el('div','notice',DICT.memoryNotice));
  else if(c.wal)out.push(el('div','notice',DICT.walSidecarNotice));
  return out
}

/* ===== 变体 ===== */
function toolLeft(){
  const f=document.createDocumentFragment();
  f.append(btn('💾',DICT.save,'tb hot'),el('span','div'),
    btn('+SQL',DICT.addSql),btn('+文',DICT.addMd),el('span','div'),
    btn('▶',DICT.runAll),btn('⌫',DICT.clearAll));
  return f
}
const V={
  A(){ // 工具条一行照现状：两个下拉 + 重扫 + 连接/断开 + 读数
    const t=el('div','toolbar'); t.append(toolLeft(),el('span','sp'),pickerSel(),tierSel(),
      btn('⟳',DICT.rescan),connectVerb(),el('span','readout'+(CONN[S.conn].refused?' dead':''),readoutText()));
    return [t,el('div','',noticeRows())]
  },
  B(){ // 一枚胶囊；其余进弹层
    const c=CONN[S.conn];
    const chip=el('button','chip');chip.type='button';chip.dataset.on=c.refused?'warn':(c.path?1:0);
    chip.append(el('span','dot'),el('span','nm',c.path?shortp(c.path)+' · '+tierLabel():DICT.notConnected),el('span','car','▾'));
    chip.onclick=e=>{S.pop=!S.pop;drawPop(chip.getBoundingClientRect())};
    const t=el('div','toolbar');t.append(toolLeft(),el('span','sp'),btn('⟳',DICT.rescan),chip);
    return [t,el('div','',noticeRows())]
  },
  C(){ // 第二行连接条：提示常驻在这一行里，不靠 tooltip
    const t=el('div','toolbar');t.append(toolLeft(),el('span','sp'),btn('⌗',DICT.outline),
      el('span','readout',readoutText()));
    const r2=el('div','row2');
    r2.append(pickerSel(),tierSel(),btn('⟳',DICT.rescan),connectVerb(),el('span','sp'));
    const c=CONN[S.conn];
    if(c.refused)r2.append(el('span','readout dead',DICT.noDbRefusal));
    else if(c.path===':memory:')r2.append(el('span','readout',DICT.memoryNotice));
    else if(c.wal)r2.append(el('span','readout',DICT.walSidecarNotice));
    else r2.append(el('span','readout',DICT.scanTruncated));
    return [t,r2]
  },
  D(){ // 中栏只剩动作；连接入口搬到状态条
    const t=el('div','toolbar');t.append(toolLeft(),el('span','sp'),btn('⌗',DICT.outline));
    return [t,el('div','',noticeRows())]
  },
};
function shortp(p){return p.replace(/^.*[\\/]/,'')}

/* ===== 弹层（B 用）===== */
function drawPop(rect){
  const pop=document.getElementById('pop');pop.innerHTML='';
  if(!S.pop){pop.classList.remove('on');return}
  const f1=el('div','fld');f1.append(el('span','fl',DICT.database),pickerSel());
  const f2=el('div','fld');f2.append(el('span','fl','档别（连接中不可改）'),tierSel());
  const row=el('div','row');row.append(btn(DICT.rescan,DICT.rescan,'verb'),connectVerb());
  pop.append(f1,f2,el('hr'),row);
  const c=CONN[S.conn];const hint=el('div','hint');
  hint.textContent = c.refused?DICT.noDbRefusal : (c.path===':memory:'?DICT.memoryNotice:(c.wal?DICT.walSidecarNotice:DICT.scanTruncated));
  pop.append(hint);
  pop.style.left=Math.min(rect.left,innerWidth-350)+'px';pop.style.top=(rect.bottom+6)+'px';pop.classList.add('on');
}

/* ===== 侧栏（四变体共用）===== */
function renderSide(){
  const side=document.getElementById('side');side.innerHTML='';
  const h=el('div','panelHeader');
  h.append(el('span','panelTitle',DICT.schema));
  const c=CONN[S.conn];
  h.append(btn('⟳',DICT.refreshSchema,'headerAction',()=>log('刷新结构'),!c.path));
  side.append(h);
  const b=el('div','panelBody');
  b.append(el('div','notebookLine',DICT.panelNotebook('examples/query-1.sqlnb')));
  if(!c.path){
    b.append(el('div','muted',DICT.notConnected));
    b.append(el('div','pointerLine',DICT.connectInToolbar));
    side.append(b);return
  }
  TABLES.forEach(t=>{
    const node=el('div','schemaNode');
    const row=el('button','tableRow');row.type='button';
    row.append(el('span','tableName',t.n),...(t.k==='view'?[el('span','tableKind',DICT.viewLabel)]:[]));
    row.onclick=()=>{S.openTable=S.openTable===t.n?null:t.n;render()};
    row.ondblclick=()=>{CELLS.push({kind:'sql',src:'SELECT * FROM "'+t.n+'" LIMIT 1000;',bar:'（刚插入，未运行）',rows:null});log('插入 SELECT * → '+t.n);render()};
    row.oncontextmenu=e=>{e.preventDefault();openMenu(e.clientX,e.clientY,t.n)};
    node.append(row);
    if(S.openTable===t.n&&COLS[t.n]){
      const ul=el('ul','columnList');
      COLS[t.n].forEach(([n,ty,pk])=>{const li=el('li','columnRow');
        li.append(el('span','columnName',n),el('span','columnType',ty),...(pk?[el('span','columnBadge',DICT.primaryKey)]:[]));ul.append(li)});
      node.append(ul);
    }
    b.append(node);
  });
  b.append(el('div','muted','上限 100 · 实际 3'));
  side.append(b);
}

/* ===== 右键菜单（工单 S8 的四项）===== */
function openMenu(x,y,name){
  const m=document.getElementById('menu');m.innerHTML='';
  const mk=(l,dis,fn)=>{const b=el('button',null,l);b.type='button';if(dis)b.disabled=true;b.onclick=()=>{closeMenu();fn&&fn()};return b};
  m.append(mk(DICT.insertSelect,false,()=>{CELLS.push({kind:'sql',src:'SELECT * FROM "'+name+'" LIMIT 1000;',bar:'（刚插入，未运行）',rows:null});log('菜单：插入 SELECT *');render()}));
  m.append(mk(DICT.insertTable,false,()=>{CELLS.push({kind:'sql',src:'"'+name+'"',bar:'（刚插入，未运行）',rows:null});log('菜单：插入表名（带引号）');render()}));
  m.append(el('div','sep'));
  m.append(mk(DICT.copyTable,false,()=>log('菜单：复制表名 → 剪贴板')));
  m.append(mk(DICT.copyCols,!COLS[name],()=>log('菜单：复制列名 → '+(COLS[name]||[]).map(c=>c[0]).join('\n')));
  );
  m.style.left=Math.min(x,innerWidth-210)+'px';m.style.top=(y+4)+'px';m.classList.add('on');
}
function closeMenu(){S.menu=null;document.getElementById('menu').classList.remove('on')}

/* ===== 中栏 ===== */
function renderMid(){
  const mid=document.getElementById('mid');mid.innerHTML='';
  const tabs=el('div','tabstrip');
  tabs.append(el('div','tab',S.view==='notebook'?'query-1.sqlnb':'query-1.sqlnb'),
    el('div','tab off','notes.md'),el('div','tab off','demo.db'));
  mid.append(tabs);

  if(S.view==='source'){
    const body=el('div','cells');
    body.append(el('pre','cellBody','{\n  "version": 2,\n  "connection": { "path": '+(CONN[S.conn].path?JSON.stringify(CONN[S.conn].path):'null')+', "access": "'+(CONN[S.conn].access||'read-only')+'" },\n  "cells": [ … ]\n}'));
    mid.append(body);
  }else{
    mid.append(...(V[S.variant]()));
    const body=el('div','cells');
    CELLS.forEach((c,i)=>{
      const cell=el('div','cell');
      const ch=el('div','cellHeader');
      ch.append(el('span','prompt','In['+(i+1)+']'),el('span','kind',c.kind==='sql'?'SQL':'文本'));
      ch.append(btn('▶',DICT.runAll===undefined?'':'运行此格','tb'),btn('⌫','清空本格输出','tb'),
        btn('▾','折叠此单元格','tb'),btn('＋SQL','在下方插入 SQL 单元格','tb'),btn('＋文','在下方插入文本单元格','tb'));
      cell.append(ch,el('div','cellBody',c.src.replace(/&/g,'&amp;').replace(/</g,'&lt;')));
      if(c.rows){
        const r=el('div','result');r.append(el('div','rbar',c.bar));
        const tb=el('table');tb.innerHTML='<thead><tr><th>name</th><th class="num">population</th></tr></thead><tbody>'+
          c.rows.map(row=>'<tr><td>'+row[0]+'</td><td class="num">'+Number(row[1]).toLocaleString('en-US')+'</td></tr>').join('')+'</tbody>';
        r.append(tb);cell.append(r);
      }
      body.append(cell);
    });
    mid.append(body);
  }

  // 状态条：S7 —— 笔记视图下让位，源码视图下整句接管；D 变体里它承载连接入口
  const c=CONN[S.conn];
  const strip=el('div','statusbar');
  const att=el('span','sb-att');
  const showFull=S.view==='source';
  if(S.variant==='D'){
    const chip=el('button','chip');chip.type='button';chip.style.height='18px';chip.style.fontSize='11px';
    chip.append(el('span','dot'),el('span','nm',c.path?shortp(c.path)+' · '+tierLabel():DICT.notConnected),el('span','car','▾'));
    chip.dataset.on=c.refused?'warn':(c.path?1:0);
    chip.onclick=e=>{S.pop=!S.pop;drawPop(chip.getBoundingClientRect())};
    att.append(chip);
  }else if(showFull){
    att.append(el('span',null,c.refused?DICT.reconnect||DICT.notConnected+' · '+(DICT.noDbRefusal):readoutText()));
  }else if(c.refused){
    att.append(el('span',null,'库文件已不可访问，请重新连接'));
  }else{
    att.append(el('span',null,''));
  }
  strip.append(att,el('span','',showFull?'':'行 1，列 1'));
  strip.append(el('span','',showFull?'行 1，列 1':''),
    el('button',null,'笔记视图'),el('button'+(showFull?' on':''),null,'源码'),el('button',null,'⌗'));
  mid.append(strip);
}

/* ===== 状态回显 + 日志 ===== */
function log(m){S.log.unshift(m);S.log=S.log.slice(0,4);render()}
function renderDump(){
  document.getElementById('dump').innerHTML=
    '<b>'+S.variant+'</b> '+VARIANTS[S.variant].name+' · '+S.view+' · '+S.conn+'<br>'+
    '锁定='+locked()+' 常驻提示='+noticeRows().length+' · 宽度='+S.width+'px'+
    (S.log.length?'<br>'+S.log.map(escapeHtml).join('<br>'):'');
}
function escapeHtml(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}

/* ===== 主渲染 ===== */
function render(){
  document.getElementById('shell').style.width=S.width+'px';
  document.getElementById('stWv').textContent=S.width+'px';
  renderSide();renderMid();
  document.getElementById('cur').innerHTML='<b>'+S.variant+'</b> '+VARIANTS[S.variant].name;
  document.getElementById('dots').innerHTML=Object.keys(VARIANTS).map(k=>
    '<button class="vbtn'+(k===S.variant?' on':'')+'" data-k="'+k+'">'+k+'</button>').join('');
  document.getElementById('dots').querySelectorAll('button').forEach(b=>b.onclick=()=>set(b.dataset.k));
  document.getElementById('pop').classList.toggle('on',S.pop&&S.variant==='B');
  if(S.pop&&S.variant==='B'){const anchor=document.querySelector('.chip')||document.querySelector('.sb-att');if(anchor)drawPop(anchor.getBoundingClientRect())}
  else document.getElementById('pop').classList.remove('on');
  renderDump();
  const p=new URLSearchParams(location.search);p.set('variant',S.variant);
  history.replaceState(null,'','?'+p.toString());
}
function set(k){S.variant=k;S.pop=false;document.getElementById('stView').disabled=false;render()}
function cycle(d){const ks=Object.keys(VARIANTS);set(ks[(ks.indexOf(S.variant)+d+ks.length)%ks.length])}

document.getElementById('prev').onclick=()=>cycle(-1);
document.getElementById('next').onclick=()=>cycle(1);
document.getElementById('stConn').onchange=e=>{S.conn=e.target.value;S.pop=false;render()};
document.getElementById('stView').onchange=e=>{S.view=e.target.value;render()};
document.getElementById('stW').oninput=e=>{S.width=+e.target.value;render()};
addEventListener('keydown',e=>{const t=e.target.tagName;if(/INPUT|SELECT|TEXTAREA/.test(t)||t==='TEXTAREA')return;
  if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1);if(e.key==='Escape'){S.pop=false;closeMenu();render()}});
addEventListener('click',e=>{if(!e.target.closest('.pop')&&!e.target.closest('.chip')){S.pop=false;document.getElementById('pop').classList.remove('on');
  if(S.variant==='B')render()}});
if(!VARIANTS[S.variant])S.variant='A';
render();
</script>
</body>
